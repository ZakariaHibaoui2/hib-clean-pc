name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: python tools/build.py

      - name: Checksums and notes
        shell: powershell
        run: |
          $h = (Get-FileHash dist/HibCleanPC.exe -Algorithm SHA256).Hash.ToLower()
          "$h  HibCleanPC.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          $version = "${{ github.ref_name }}".TrimStart('v')
          $log = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?ms)^## $([regex]::Escape($version))\s*\r?\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Hib Clean PC $version" }
          $fence = '```'
          $body = @(
            $notes, '',
            '**Install** (PowerShell, no warning):', '',
            "${fence}powershell", 'irm https://zakariahibaoui2.github.io/hib-clean-pc/install.ps1 | iex', $fence, '',
            "SHA-256 of HibCleanPC.exe: ``$h``"
          ) -join "`n"
          Set-Content -Path dist/notes.md -Value $body -Encoding utf8

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/HibCleanPC.exe dist/SHA256SUMS.txt --title "Hib Clean PC ${{ github.ref_name }}" --notes-file dist/notes.md
