<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hib Clean PC</title>
  <link rel="icon" href="mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <aside class="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="hcTile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16405A"/><stop offset="1" stop-color="#071A26"/></linearGradient><linearGradient id="hcWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5CF0D8"/><stop offset="1" stop-color="#1FA9C9"/></linearGradient><clipPath id="hcDrop"><path d="M16 5.5C16 5.5 8.5 13.6 8.5 19a7.5 7.5 0 0 0 15 0C23.5 13.6 16 5.5 16 5.5Z"/></clipPath></defs><rect x="1" y="1" width="30" height="30" rx="9" fill="url(#hcTile)"/><rect x="1.5" y="1.5" width="29" height="29" rx="8.5" fill="none" stroke="#39E0C6" stroke-opacity=".35"/><path d="M16 5.5C16 5.5 8.5 13.6 8.5 19a7.5 7.5 0 0 0 15 0C23.5 13.6 16 5.5 16 5.5Z" fill="#EAF6FA"/><path clip-path="url(#hcDrop)" d="M7 18.2c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0V28H7Z" fill="url(#hcWater)"/><circle cx="13.3" cy="14.8" r="1.3" fill="#fff" opacity=".9"/></svg>
      <span>Hib Clean PC</span>
    </div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <label class="lang">
        <span class="sr" data-t="language">Language</span>
        <select id="lang">
          <option value="en">English</option>
          <option value="fr">Français</option>
          <option value="ar">العربية</option>
        </select>
      </label>
      <span id="version" class="version"></span>
    </div>
  </aside>

  <main id="view" tabindex="-1"></main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <!-- Full-screen colour test for the used-laptop check -->
  <div id="screen-test" class="screen-test" hidden>
    <p id="screen-test-hint"></p>
  </div>

  <!-- The printable report; filled when the PDF is made -->
  <article id="report" class="report" aria-hidden="true"></article>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
